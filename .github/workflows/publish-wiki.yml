name: Publish wiki

# Mirrors docs/wiki/ to this repository's wiki. Edit the wiki only in docs/wiki/.
on:
  push:
    branches: [main]
    paths:
      - "docs/wiki/**"
      - ".github/workflows/publish-wiki.yml"
  workflow_dispatch:

concurrency:
  group: publish-wiki
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone wiki repo
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.wiki.git" ../wiki-publish

      - name: Mirror docs/wiki
        run: rsync -a --delete --exclude .git docs/wiki/ ../wiki-publish/

      - name: Commit and push
        working-directory: ../wiki-publish
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No wiki changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Wiki sync from ${GITHUB_SHA::7}"
          git push
